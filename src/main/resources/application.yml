spring:
  application:
    name: emergency-alert-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# JWT Security Configuration
jwt:
  # Minimum 256-bit base64/hex secret for HMAC-SHA256
  secret: ${JWT_SECRET:EmergencyAlertSystemSuperSecretKeyWithAtLeast256BitsLengthForSecureHMAC256!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

# System Disclaimer
system:
  disclaimer: "DEMO & EDUCATIONAL ALERT SYSTEM - NOT CONNECTED TO OFFICIAL FIRST RESPONDERS OR EAS/WEA INFRASTRUCTURE."
