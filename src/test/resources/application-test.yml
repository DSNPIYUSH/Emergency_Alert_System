spring:
  datasource:
    url: jdbc:h2:mem:emergency_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

jwt:
  secret: TestSecretKeyForTestingPurposesMustBeAtLeast256BitsLongAndSecure1234567890!
  expiration-ms: 3600000
