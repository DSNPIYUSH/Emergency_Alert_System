services:
  # MySQL Database Container
  db:
    image: mysql:8.0.36
    container_name: emergency-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: emergency_db
      MYSQL_USER: emergency_user
      MYSQL_PASSWORD: emergency_secret
      MYSQL_ROOT_PASSWORD: root_master_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    networks:
      - emergency-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_master_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot Emergency Alert System Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency-alert-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: emergency_db
      DB_USERNAME: emergency_user
      DB_PASSWORD: emergency_secret
      JWT_SECRET: ProductionGradeEmergencySecretKeyAtLeast256BitsLongForHMACSHA256Algorithm!
      JWT_EXPIRATION_MS: 86400000
    networks:
      - emergency-network

volumes:
  mysql_data:
    driver: local

networks:
  emergency-network:
    driver: bridge
